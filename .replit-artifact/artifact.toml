kind = "web"
previewPath = "/"
title = "TravelBuzzy"
version = "1.0.0"
id = "artifacts/travelbuzzy"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19913

[services.development]
run = "pnpm --filter @workspace/travelbuzzy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/travelbuzzy", "run", "build" ]
publicDir = "artifacts/travelbuzzy/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19913"
BASE_PATH = "/"
